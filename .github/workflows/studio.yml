name: Deploy Sanity Studio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'studio/**'
      - 'src/lib/defaults.ts'
      - 'src/lib/editorial.json'
      - '.github/workflows/studio.yml'

permissions:
  contents: read

concurrency:
  group: sanity-studio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: studio
    env:
      SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID || '4gf21eo2' }}
      SANITY_STUDIO_DATASET: ${{ vars.SANITY_DATASET || 'production' }}
      SANITY_STUDIO_HOST: ${{ vars.SANITY_STUDIO_HOST || 'mechanika-ciala-4gf21eo2' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Check deployment secret
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: |
          if [ -z "$SANITY_AUTH_TOKEN" ]; then
            echo '::error::Add SANITY_AUTH_TOKEN in repository Settings > Secrets and variables > Actions.'
            exit 1
          fi
      - run: npm ci
      - name: Deploy editor to Sanity hosting
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npm exec -- sanity deploy
